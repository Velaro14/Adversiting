name: Sync upstream advertising rules

on:
  schedule:
    # Daily at 19:17 UTC (03:17 UTC+8 on the next calendar day)
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-rules.yml"

permissions:
  contents: write

concurrency:
  group: sync-advertising-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rules branch
        uses: actions/checkout@v7.0.1
        with:
          ref: rules-sync
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Semantic regression suite: ABP anchor/wildcard/case and AdAway exact-host behavior.
      - name: Run converter regression tests
        run: python -m unittest scripts/test_converter.py

      # The converter fetches both sources before writing, rejects suspiciously
      # small/malformed parses, then validates generated outputs before commit.
      - name: Fetch upstreams, convert and validate
        run: python scripts/convert_rules.py

      - name: Commit updates when changed
        shell: bash
        run: |
          set -euo pipefail
          git add upstream rules metadata.json
          if git diff --cached --quiet; then
            echo "No upstream or generated-output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream advertising rules"
          git push origin HEAD:rules-sync
