name: Sync upstream advertising rules

on:
  schedule:
    # Daily at 19:17 UTC (03:17 UTC+8 on the next calendar day)
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-rules.yml"

permissions:
  contents: write

concurrency:
  group: sync-advertising-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rules branch
        uses: actions/checkout@v4
        with:
          ref: rules-sync
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The converter atomically fetches both qy-Ads-Rule and AdAway.
      - name: Fetch upstreams and convert
        run: python scripts/convert_rules.py

      - name: Commit updates when changed
        shell: bash
        run: |
          git add upstream rules metadata.json
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream advertising rules"
          git push origin HEAD:rules-sync
